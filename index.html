<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Moeratic Florist</title>
</head>
<body class="bg-zinc-950 min-h-screen text-zinc-300 font-sans selection:bg-zinc-700 selection:text-white">

 <header class="bg-zinc-900 shadow-sm p-5 text-center border-b border-zinc-800">
  <!-- Pastikan "logo.png" disesuaikan dengan nama file Anda -->
  <img src="logo.png" alt="Moeratic Logo" class="h-12 md:h-16 mx-auto mb-1 object-contain">
  <p class="text-zinc-500 text-sm mt-2 tracking-wide">Pemesanan Rangkaian Bunga Online</p>
</header>

  <main class="max-w-xl mx-auto p-4 md:p-6 my-6">
    <div class="bg-zinc-900 p-6 rounded-2xl shadow-2xl border border-zinc-800">
      <h2 class="text-xl font-bold text-white mb-6 text-center uppercase tracking-wider">Formulir Pemesanan</h2>
      
      <form id="orderForm">
        <div class="mb-5">
          <label class="block text-sm font-semibold mb-2 text-zinc-400">Tanggal Pengiriman</label>
          <input type="date" id="tglPengantaran" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-zinc-500 focus:border-zinc-500 outline-none transition-all color-scheme-dark">
        </div>

        <div class="mb-5">
          <label class="block text-sm font-semibold mb-2 text-zinc-400">Nama Lengkap</label>
          <input type="text" id="nama" placeholder="Nama Anda" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white placeholder-zinc-600 focus:ring-2 focus:ring-zinc-500 outline-none transition-all">
        </div>

        <div class="mb-5">
          <label class="block text-sm font-semibold mb-2 text-zinc-400">Nomor WA</label>
          <input type="tel" id="whatsapp" placeholder="08123456789" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white placeholder-zinc-600 focus:ring-2 focus:ring-zinc-500 outline-none transition-all">
        </div>

        <div class="mb-5">
          <label class="block text-sm font-semibold mb-2 text-zinc-400">Pesanan</label>
          <select id="pesanan" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-zinc-500 outline-none transition-all">
            <option value="Bouquet Mawar Red Classic">Bouquet Mawar Red Classic</option>
            <option value="Bouquet Bunga Matahari">Bouquet Bunga Matahari</option>
            <option value="Rangkaian Tulip Mix">Rangkaian Tulip Mix</option>
            <option value="Custom Bouquet">Custom Bouquet</option>
          </select>
        </div>

        <div class="mb-5">
          <label class="block text-sm font-semibold mb-2 text-zinc-400">Alamat Pengiriman</label>
          <textarea id="alamat" rows="2" placeholder="Alamat lengkap penerima..." required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white placeholder-zinc-600 focus:ring-2 focus:ring-zinc-500 outline-none transition-all"></textarea>
        </div>

        <div class="mb-5">
          <label class="block text-sm font-semibold mb-2 text-zinc-400">Catatan Khusus</label>
          <textarea id="catatan" rows="2" placeholder="Pesan pada kartu ucapan, dll..." class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white placeholder-zinc-600 focus:ring-2 focus:ring-zinc-500 outline-none transition-all"></textarea>
        </div>

        <!-- Box QRIS Monochrome -->
        <div class="mb-5 p-5 bg-zinc-950 border border-zinc-800 rounded-xl text-center flex flex-col items-center">
          <span class="block text-sm font-bold text-white mb-4 uppercase tracking-widest">Pembayaran QRIS</span>
          
          <!-- PASTIKAN NAMA FILE GAMBAR QRIS SESUAI -->
          <img src="qris.png" alt="QRIS Moeratic Florist" class="w-48 h-auto mb-4 rounded-lg border border-zinc-700 p-2 bg-white">
          
          <p class="text-xs text-zinc-500">Scan kode QR di atas untuk transfer, lalu unggah buktinya di bawah ini.</p>
        </div>

        <div class="mb-8">
          <label class="block text-sm font-semibold mb-2 text-zinc-400">Upload Bukti Bayar</label>
          <input type="file" id="buktiBayar" accept="image/*" required class="w-full border border-zinc-700 rounded-lg p-2 text-sm text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-white file:text-black hover:file:bg-zinc-200 transition-all bg-zinc-950">
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-white hover:bg-zinc-200 text-black font-extrabold tracking-wide py-3.5 rounded-lg transition-all shadow-lg">
          KIRIM PESANAN
        </button>
      </form>

      <div id="statusMsg" class="mt-5 text-center font-semibold hidden"></div>
    </div>
  </main>

  <style>
    /* Tambahan untuk membuat ikon kalender pada input date menjadi putih */
    .color-scheme-dark::-webkit-calendar-picker-indicator {
        filter: invert(1);
    }
  </style>

  <script>
    // 1. GANTI URL DI BAWAH DENGAN URL APPS SCRIPT ANDA
    const SCRIPT_URL = "MASUKKAN_URL_APPS_SCRIPT_ANDA_DISINI";

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      const statusMsg = document.getElementById('statusMsg');
      const fileInput = document.getElementById('buktiBayar');
      
      btn.innerText = "MENGUNGGAH & MENYIMPAN...";
      btn.disabled = true;
      statusMsg.classList.add('hidden');

      try {
        let fileBase64 = "";
        let fileName = "";

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          fileName = file.name;
          fileBase64 = await convertBase64(file);
        }

        const payload = {
          tglPengantaran: document.getElementById('tglPengantaran').value,
          nama: document.getElementById('nama').value,
          whatsapp: document.getElementById('whatsapp').value,
          pesanan: document.getElementById('pesanan').value,
          alamat: document.getElementById('alamat').value,
          catatan: document.getElementById('catatan').value,
          statusQris: "QRIS (Sudah Transfer)",
          buktiBayarBase64: fileBase64,
          namaFile: fileName
        };

        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        statusMsg.innerText = "Pesanan berhasil dikirim!";
        statusMsg.className = "mt-5 text-center font-bold text-white bg-zinc-800 py-3 rounded-lg border border-zinc-700";
        statusMsg.classList.remove('hidden');
        document.getElementById('orderForm').reset();

      } catch (err) {
        statusMsg.innerText = "Terjadi kesalahan, coba lagi.";
        statusMsg.className = "mt-5 text-center font-bold text-red-400 bg-red-950 py-3 rounded-lg border border-red-900";
        statusMsg.classList.remove('hidden');
      } finally {
        btn.innerText = "KIRIM PESANAN";
        btn.disabled = false;
      }
    });

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const fileReader = new FileReader();
        fileReader.readAsDataURL(file);
        fileReader.onload = () => resolve(fileReader.result);
        fileReader.onerror = (error) => reject(error);
      });
    }
  </script>
</body>
</html>
